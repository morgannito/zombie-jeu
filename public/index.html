<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Zombie Multijoueur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="stats">
            <div id="health-container">
                <span>Vie:</span>
                <div id="health-bar">
                    <div id="health-fill"></div>
                </div>
                <span id="health-text">100</span>
            </div>
            <div id="score">Score: <span id="score-value">0</span></div>
            <div id="wave">Vague: <span id="wave-value">1</span></div>
            <div id="weapon">Arme: <span id="weapon-value">Pistolet</span></div>
            <div id="players-online">Joueurs en ligne: <span id="players-count">1</span></div>
            <div id="zombies-alive">Zombies: <span id="zombies-count">0</span></div>
        </div>

        <div id="wave-announcement" style="display: none;">
            <h1>VAGUE <span id="wave-number">2</span></h1>
            <p>Préparez-vous!</p>
        </div>

        <div id="game-over" style="display: none;">
            <h1>GAME OVER</h1>
            <p>Score final: <span id="final-score">0</span></p>
            <p>Vague atteinte: <span id="final-wave">1</span></p>
            <button id="respawn-btn">Recommencer</button>
        </div>

        <div id="instructions">
            <h3>Contrôles</h3>
            <p><strong>WASD</strong> ou <strong>Flèches</strong> : Déplacement</p>
            <p><strong>Souris</strong> : Viser</p>
            <p><strong>Clic gauche</strong> : Tirer</p>
        </div>

        <canvas id="minimap"></canvas>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
